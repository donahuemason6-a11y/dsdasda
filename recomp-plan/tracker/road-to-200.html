<title>Road to 200</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column of cards under a sticky tab row. The week strip (P P L P P L R) is the spine of the Today view. */
:root {
  --page: #f2f4f7; --surface: #fdfdfe; --sunken: #e8ecf2; --ink: #0e1420; --ink-2: #465163; --ink-3: #636d7d;
  --line: #dfe3ea; --axis: #c2c8d2; --accent: #2a78d6; --on-accent: #ffffff; --track: #d3e3f8; --plan: #8a93a3;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --warn-ink: #7a5200; --crit: #d03b3b;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0b0d11; --surface: #161a21; --sunken: #202632; --ink: #eef1f6; --ink-2: #bcc4d1; --ink-3: #8f98a8;
  --line: #2a303b; --axis: #3a4250; --accent: #3987e5; --on-accent: #0b0d11; --track: #173152; --plan: #8f98a8;
  --good: #0ca30c; --good-ink: #5fd35f; --warn: #fab219; --warn-ink: #fab219; --crit: #e66767; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #0b0d11; --surface: #161a21; --sunken: #202632; --ink: #eef1f6; --ink-2: #bcc4d1; --ink-3: #8f98a8;
  --line: #2a303b; --axis: #3a4250; --accent: #3987e5; --on-accent: #0b0d11; --track: #173152; --plan: #8f98a8;
  --good: #0ca30c; --good-ink: #5fd35f; --warn: #fab219; --warn-ink: #fab219; --crit: #e66767; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
.app { max-width: 760px; margin: 0 auto; padding-block: 0 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 22px; font-weight: 700; }
h2 { font-size: 16px; font-weight: 700; }
h3 { font-size: 13px; font-weight: 500; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page); padding-block: 12px 8px; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.save { font-size: 12px; color: var(--ink-3); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--sunken); padding: 4px; border-radius: 12px; }
.tabs a { text-align: center; padding: 8px 4px; border-radius: 9px; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 14px; }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

main { display: grid; gap: 12px; }
.view { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.card { scroll-margin-top: calc(118px + env(safe-area-inset-top, 0px)); }
.card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sub { color: var(--ink-2); font-size: 13px; }
.muted { color: var(--ink-3); font-size: 12.5px; }
.note { background: var(--sunken); border-radius: 8px; padding: 9px 11px; font-size: 13px; color: var(--ink-2); }
.note strong { color: var(--ink); }

.datenav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.datenav .d { font-family: var(--display); font-weight: 700; font-size: 17px; }
.icon { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.strip button { display: grid; gap: 1px; justify-items: center; padding: 7px 0 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-width: 0; }
.strip .l { font-family: var(--display); font-weight: 700; font-size: 16px; }
.strip .n { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.strip .k { height: 5px; width: 5px; border-radius: 50%; background: transparent; }
.strip button.done .k { background: var(--good); }
.strip button.today { border-color: var(--accent); }
.strip button.sel { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.strip button.sel .n { color: var(--on-accent); }
.strip button.sel.done .k { background: var(--on-accent); }

.job { display: grid; gap: 8px; }
.job .line { display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: baseline; }
.job .line b { font-family: var(--display); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 500; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font-size: 13.5px; font-weight: 500; user-select: none; background: var(--surface); }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; color: var(--ink-2); font-weight: 500; }
input[type="number"], input[type="text"] { width: 100%; min-width: 0; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--axis); background: var(--surface); font-size: 16px; }
input.big { font-size: 26px; font-weight: 700; padding: 8px 12px; font-family: var(--font); }
.btn { padding: 9px 13px; border-radius: 9px; border: 1px solid var(--axis); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn.danger { color: var(--crit); }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid5 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.wrow { display: grid; grid-template-columns: minmax(0, 150px) 1fr; gap: 14px; align-items: center; }
.kv { display: grid; gap: 2px; font-size: 13px; color: var(--ink-2); }
.kv b { color: var(--ink); font-variant-numeric: tabular-nums; }

.meter { position: relative; height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
.meter > i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent); min-width: 0; }
.meter.warn > i { background: var(--warn); }
.meter.good > i { background: var(--good); }
.ticks { position: relative; height: 14px; font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ticks span { position: absolute; top: 0; transform: translateX(-50%); }
.ticks span:first-child { transform: none; } .ticks span:last-child { transform: translateX(-100%); }
.big-num { font-size: 26px; font-weight: 700; line-height: 1.1; }
.big-num small { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.pill.good { color: var(--good-ink); border-color: var(--good); }
.pill.warn { color: var(--warn-ink); border-color: var(--warn); }

.list { display: grid; gap: 0; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
.item:first-child { border-top: 0; }
.item .nm { font-weight: 600; overflow-wrap: anywhere; }
.item .mac { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.item .act { display: flex; gap: 6px; align-items: center; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--axis); border-radius: 9px; overflow: hidden; }
.step button { width: 32px; height: 32px; border: 0; background: var(--surface); cursor: pointer; font-size: 17px; }
.step button:focus-visible { outline-offset: -2px; }
.step span { min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; font-size: 13.5px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { padding: 7px 11px; border-radius: 999px; border: 1px solid var(--axis); background: var(--surface); cursor: pointer; font-size: 13.5px; font-weight: 500; text-align: left; max-width: 100%; overflow-wrap: anywhere; }
.chip small { color: var(--ink-3); font-weight: 400; }
details { min-width: 0; }
details > summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 4px 0; }
details[open] > summary { margin-bottom: 10px; }
.form { display: grid; gap: 10px; }
.ing { display: grid; grid-template-columns: minmax(0, 2.2fr) repeat(4, minmax(0, 1fr)) 30px; gap: 5px; align-items: end; }
.ing input { padding: 7px 6px; font-size: 14px; }
@media (pointer: coarse) { input[type="number"]:not(.big), input[type="text"] { font-size: 16px !important; } }
.ing .x { height: 34px; border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 16px; }
.inghead { font-size: 11px; color: var(--ink-3); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { display: grid; gap: 2px; min-width: 0; }
.stat .v { font-size: 22px; font-weight: 700; line-height: 1.15; }
.stat .l { font-size: 12px; color: var(--ink-2); }
.seg { display: inline-flex; background: var(--sunken); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-line { width: 16px; height: 0; border-top: 2px solid var(--accent); }
.key-line.plan { border-top-color: var(--plan); }
.key-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.key-bar { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); }
.chart { position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.chart .lab { fill: var(--ink); font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tip { position: absolute; z-index: 3; pointer-events: none; background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 7px 9px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,0.16); min-width: 130px; }
.tip .t { color: var(--ink-2); margin-bottom: 3px; }
.tip .r { display: flex; align-items: center; gap: 7px; justify-content: space-between; }
.tip .r span { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tip .r b { font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr.now td { background: var(--sunken); font-weight: 600; }
.lifts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.lifts ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 13.5px; }
.lifts li span { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rules { display: grid; gap: 8px; font-size: 13.5px; }
.rules div { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.rules div:first-child { border-top: 0; padding-top: 0; }
.rules div span { color: var(--ink-2); }
@media (max-width: 520px) {
  .lifts { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  .rules div { grid-template-columns: 1fr; gap: 2px; }
  .grid5 { grid-template-columns: 1fr 1fr; }
  .ing { grid-template-columns: repeat(4, minmax(0, 1fr)) 30px; }
  .ing .field:first-child { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) { .meter > i { transition: width 0.25s ease; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Road to 200</h1><span class="save" id="saveState" aria-live="polite"></span></div>
    <nav class="tabs" aria-label="Sections">
      <a href="#today" data-tab="today">Today</a>
      <a href="#trends" data-tab="trends">Trends</a>
      <a href="#foods" data-tab="foods">Foods</a>
      <a href="#plan" data-tab="plan">Plan</a>
    </nav>
  </header>
  <main>
    <div class="note" id="loadNote" hidden></div>
    <section class="view" id="view-today">
      <div class="card" id="c-day"></div>
      <div class="card" id="c-weight"></div>
      <div class="card" id="c-water"></div>

    <section class="view" id="view-trends" hidden>
      <div class="card" id="c-stats"></div>

      <div class="card" id="c-thisweek"></div>

  </main>
</div>

<script>
(() => {
'use strict';
// ---- The plan (same numbers as the PDF). Each row: goal weight at week end, calories, protein, incline, minutes.
const START = '2026-11-16', START_W = 271;
const ROWS = [[269,2300,190,5,20],[267,2300,190,6,20],[265,2300,190,6,25],[263,2300,190,7,25],[261,2300,190,8,25],[259,2300,190,8,30],[257,2300,190,9,30],[255,2300,190,10,30],[253,2200,190,10,35],[251,2200,190,11,35],[249,2200,190,12,35],[247,2200,190,12,40],[245,2200,190,12,40],[243,2200,190,12,40],[241,2200,190,12,40],[239,2200,190,12,40],[237,2100,190,12,40],[235,2100,190,12,40],[233,2100,190,12,40],[231,2100,190,12,40],[229,2100,190,12,40],[227,2100,190,12,40],[225,2100,190,12,40],[223,2000,190,12,40],[221,2000,190,12,40],[219,2000,190,12,40],[217,2000,190,12,40],[215,2000,190,12,40],[213,2000,190,12,40],[211,2000,190,12,40],[209,2000,190,12,40],[207.5,2100,190,12,40],[206,2100,190,12,40],[204.5,2100,190,12,40],[203,2100,190,12,40],[201.5,2100,190,12,40],[200,2100,190,12,40]];
const CONCERT = '2027-05-03';
const DAYS = ['Push', 'Pull', 'Legs', 'Push', 'Pull', 'Legs', 'Rest'];
const INCLINE_DAY = [true, true, false, true, true, false, false];
const LIFTS = {
  Push: [['Seated chest press', '8–12'], ['Seated pec fly', '10–15'], ['Seated shoulder press', '8–12'], ['Seated triceps extension', '10–15']],
  Pull: [['Lat pulldown', '8–12'], ['Seated row', '8–12'], ['Rear delt fly', '12–15'], ['Biceps curl', '10–15']],
  Legs: [['Leg press', '10–15'], ['Leg extension', '10–15'], ['Seated leg curl', '10–15'], ['Calf raise on the leg press', '12–15']],
};
// Starter foods are estimates from typical labels. They are offered as templates, never logged by themselves.
const STARTERS = [
  { name: 'Chicken bacon ranch calzone', recipe: [
    ['Flour, 3/4 cup', 340, 10, 72, 1], ['Nonfat Greek yogurt, 3/4 cup', 100, 17, 6, 1], ['Chicken breast, 6 oz raw', 204, 38, 0, 4.5],
    ['Bacon, 2 strips cooked', 85, 6, 0, 6.5], ['Ranch seasoning, 1 tbsp', 30, 0.5, 6, 0], ['Mozzarella, 1/2 cup shredded', 160, 14, 2, 11],
    ['Pepper jack, 1/4 cup shredded', 105, 6.5, 0.5, 8.5]] },
  { name: 'Core Power Elite (42 g), 1 bottle', kcal: 230, p: 42, c: 9, f: 3.5 },
  { name: 'Core Power (26 g), 1 bottle', kcal: 170, p: 26, c: 8, f: 4.5 },
  { name: 'Eggs with cheese and bacon', recipe: [['Eggs, 3 large', 216, 18.9, 1.1, 14.3], ['Kraft Singles, 1 slice', 50, 3, 2, 3.5], ['Bacon, 2 strips cooked', 85, 6, 0, 6.5]] },
  { name: 'Egg, 1 large', kcal: 72, p: 6.3, c: 0.4, f: 4.8 },
  { name: 'Carton egg whites, 1/2 cup', kcal: 63, p: 13, c: 1, f: 0 },
  { name: 'Fairlife fat-free milk, 1 cup', kcal: 80, p: 13, c: 6, f: 0 },
  { name: 'Banana', kcal: 105, p: 1, c: 27, f: 0 },
  { name: 'Apple', kcal: 95, p: 0, c: 25, f: 0 },
  { name: 'Frozen broccoli or stir-fry vegetables, 2 cups', kcal: 80, p: 5, c: 14, f: 0 },
];

// ---- small helpers
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2], 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const todayIso = () => iso(new Date());
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const dow = s => (parse(s).getDay() + 6) % 7;
const shortDate = s => { const d = parse(s); return MON[d.getMonth()] + ' ' + d.getDate(); };
const longDate = s => DOW[dow(s)] + ', ' + shortDate(s);
const num = (v, dp = 0) => (v == null || isNaN(v)) ? '–' : Number(v).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
const one = v => num(v, 1);
const val = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const WEEKS = ROWS.map((r, i) => ({ n: i + 1, mon: addDays(START, i * 7), sun: addDays(START, i * 7 + 6), goal: r[0], kcal: r[1], protein: r[2], incline: r[3], minutes: r[4] }));
const END = WEEKS[WEEKS.length - 1].sun;
const weekIdx = s => Math.floor(diffDays(START, s) / 7);
const planWeek = s => { const i = weekIdx(s); return i >= 0 && i < WEEKS.length ? WEEKS[i] : null; };
function planAt(s) {                       // plan weight on a date: straight lines between the Sunday goals
  const d = diffDays(START, s) + 1; if (d <= 0) return START_W;
  const i = Math.floor((d - 1) / 7); if (i >= WEEKS.length) return WEEKS[WEEKS.length - 1].goal;
  const prev = i === 0 ? START_W : WEEKS[i - 1].goal; return prev + (WEEKS[i].goal - prev) * ((d - i * 7) / 7);
}
const tierFor = a => a > 255 ? [2300, 190] : a > 240 ? [2200, 190] : a > 225 ? [2100, 190] : a > 210 ? [2000, 190] : [2100, 190];

// ---- state
const S = { days: {}, foods: [], settings: {} };
const EMPTY = Object.freeze({ w: null, water: [], steps: null, lift: false, incline: false, foods: [] });
const ui = { date: todayIso(), tab: 'today', range: '8w', confirm: null, editFood: null, usualSaved: null };
const draft = { food: { name: '', kcal: '', p: '', c: '', f: '', qty: '1', save: true }, water: '', recipe: null };

    <div class="grid5" style="grid-template-columns:repeat(3,1fr)">
      <label class="field"><span>Calories a day</span><input type="number" id="setKcal" inputmode="numeric" min="2000" step="50" data-act="setting" data-k="kcal" value="${st.kcal || ''}" placeholder="${T.auto[0]}"></label>
      <label class="field"><span>Protein (g)</span><input type="number" id="setProtein" inputmode="numeric" min="100" step="5" data-act="setting" data-k="protein" value="${st.protein || ''}" placeholder="${T.auto[1]}"></label>
      <label class="field"><span>Water (oz)</span><input type="number" id="setWater" inputmode="numeric" min="32" step="8" data-act="setting" data-k="water" value="${st.water || ''}" placeholder="128"></label>
    </div>
    <p class="muted">Use the calorie box when the plan tells you to add 200. Clear it to go back to the plan\'s number. The plan never goes under 2,000.</p>
    <div class="btnrow"><button class="btn small" type="button" id="copyData" data-act="copy">Copy my log as text</button><span class="muted" id="copyMsg" role="status"></span></div>`);
}

let held = false, owed = false;           // never repaint between mousedown and mouseup: the button under the pointer would be replaced and its click lost
const release = () => { held = false; if (owed) { owed = false; setTimeout(renderAll, 0); } };
document.addEventListener('pointerdown', e => { if (e.button === 0) held = true; }, true);
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, release, true)); window.addEventListener('blur', release);
function renderAll() {
  if (held) { owed = true; return; }
  document.querySelectorAll('.tabs a').forEach(a => { if (a.dataset.tab === ui.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  ['today', 'trends', 'foods', 'plan'].forEach(t => { $('#view-' + t).hidden = t !== ui.tab; });
  if (ui.tab === 'today') { renderDay(); renderWeight(); renderWater(); renderFood(); }
  else if (ui.tab === 'trends') { renderStats(); renderWeightChart(); renderWeeks(); renderBars(); }
  else if (ui.tab === 'foods') { renderMyFoods(); renderRecipe(); renderStarter(); }
  else renderPlan();
}

// ---- actions
function setDraft(path, v) { const parts = path.split('.'); let o = draft; for (let i = 0; i < parts.length - 1; i++) { o = o[parts[i]]; if (o == null) return; } o[parts[parts.length - 1]] = v; }
document.addEventListener('input', e => { const el = e.target; if (!el.dataset || !el.dataset.draft) return; setDraft(el.dataset.draft, el.type === 'checkbox' ? el.checked : el.value);
  if (el.dataset.draft.startsWith('recipe') && draft.recipe) { const t = recipeTotals(draft.recipe), out = $('#rTotal'); if (out) out.innerHTML = `One serving: <b>${num(t.kcal)}</b> cal · <b>${num(t.p)}</b> g protein · ${num(t.c)} g carbs · ${num(t.f)} g fat`; } });
document.addEventListener('focusout', () => setTimeout(() => { if (document.querySelector('[data-stale]')) renderAll(); }, 0));
document.addEventListener('change', e => {
  const el = e.target, act = el.dataset && el.dataset.act; if (!act) return;
  if (act === 'weight') { const v = val(el.value); const d = day(ui.date, true); d.w = v != null && v >= 100 && v <= 500 ? Math.round(v * 10) / 10 : null; if (v != null && d.w == null) el.value = ''; touch(docId(ui.date)); }
  else if (act === 'steps') { const v = val(el.value); day(ui.date, true).steps = v != null && v >= 0 ? Math.round(v) : null; touch(docId(ui.date)); }
  else if (act === 'flag') { day(ui.date, true)[el.dataset.k] = el.checked; touch(docId(ui.date)); }
  else if (act === 'setting') { const v = val(el.value); S.settings = S.settings || {}; const k = el.dataset.k; let n = v != null && v > 0 ? Math.round(v) : null; if (k === 'kcal' && n != null && n < 2000) n = 2000; if (n == null) delete S.settings[k]; else S.settings[k] = n; el.value = n == null ? '' : n; touch('settings'); }
  else return;
  setTimeout(renderAll, 0);
});
function addEntry(f, qty) { const d = day(ui.date, true); const same = f.fid && d.foods.find(x => x.fid === f.fid && x.kcal === f.kcal && x.p === f.p && (x.c || 0) === (f.c || 0) && (x.f || 0) === (f.f || 0)); if (same) same.qty = Math.round(((same.qty || 1) + qty) * 100) / 100; else d.foods.push({ id: uid(), fid: f.fid || null, name: f.name, kcal: f.kcal, p: f.p, c: f.c || 0, f: f.f || 0, qty }); touch(docId(ui.date)); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return; const act = el.dataset.act;
  if (act !== 'delFood') ui.confirm = null;
  if (act === 'goto') ui.date = el.dataset.date;
  else if (act === 'shift') ui.date = addDays(ui.date, +el.dataset.n);
  else if (act === 'water') { day(ui.date, true).water.push(+el.dataset.v); touch(docId(ui.date)); }
  else if (act === 'waterCustom') { const v = val(draft.water); if (v != null && v > 0 && v <= 300) { day(ui.date, true).water.push(Math.round(v * 10) / 10); draft.water = ''; const inp = $('#waterCustom'); if (inp) inp.value = ''; touch(docId(ui.date)); } }
  else if (act === 'waterUndo') { const d = day(ui.date, true); d.water.pop(); touch(docId(ui.date)); }
  else if (act === 'addSaved') { const f = S.foods.find(x => x.id === el.dataset.id); if (f) addEntry({ fid: f.id, name: f.name, kcal: f.kcal, p: f.p, c: f.c, f: f.f }, 1); }
  else if (act === 'logUsual') { ((S.settings && S.settings.usual) || []).forEach(x => addEntry({ fid: x.fid, name: x.name, kcal: x.kcal, p: x.p, c: x.c, f: x.f }, x.qty || 1)); }
  else if (act === 'saveUsual') { const d = day(ui.date); S.settings = S.settings || {}; S.settings.usual = (d.foods || []).map(x => ({ fid: x.fid || null, name: x.name, kcal: x.kcal, p: x.p, c: x.c || 0, f: x.f || 0, qty: x.qty || 1 })); ui.usualSaved = ui.date; touch('settings'); }
  else if (act === 'qty') { const d = day(ui.date, true), x = d.foods.find(y => y.id === el.dataset.id); if (x) { x.qty = Math.round(((x.qty || 1) + +el.dataset.n) * 100) / 100; if (x.qty <= 0) d.foods = d.foods.filter(y => y !== x); touch(docId(ui.date)); } }
  else if (act === 'rmEntry') { const d = day(ui.date, true); d.foods = d.foods.filter(y => y.id !== el.dataset.id); touch(docId(ui.date)); }
  else if (act === 'range') ui.range = el.dataset.v;
  else if (act === 'delFood') { if (ui.confirm === el.dataset.id) { S.foods = S.foods.filter(x => x.id !== el.dataset.id); ui.confirm = null; touch('foods'); } else ui.confirm = el.dataset.id; }
  else if (act === 'editFood') { const f = S.foods.find(x => x.id === el.dataset.id); if (f) { draft.recipe = { id: f.id, name: f.name, makes: String(f.makes || 1), rows: (f.recipe && f.recipe.length ? f.recipe : [{ name: f.name, kcal: f.kcal, p: f.p, c: f.c || 0, f: f.f || 0 }]).map(r => ({ name: r.name, kcal: String(r.kcal), p: String(r.p), c: String(r.c), f: String(r.f) })) }; setTimeout(() => { const c = $('#c-recipe'); if (c) c.scrollIntoView({ block: 'start' }); }, 0); } }
  else if (act === 'addIng') { draft.recipe.rows.push({ name: '', kcal: '', p: '', c: '', f: '' }); }
  else if (act === 'rmIng') { draft.recipe.rows.splice(+el.dataset.i, 1); if (!draft.recipe.rows.length) draft.recipe.rows.push({ name: '', kcal: '', p: '', c: '', f: '' }); }
  else if (act === 'clearRecipe') draft.recipe = blankRecipe();
  else if (act === 'openStarter') { const x = STARTERS[+el.dataset.i]; draft.recipe = { id: null, name: x.name, makes: '1', rows: x.recipe.map(r => ({ name: r[0], kcal: String(r[1]), p: String(r[2]), c: String(r[3]), f: String(r[4]) })) }; setTimeout(() => { const c = $('#c-recipe'); if (c) c.scrollIntoView({ block: 'start' }); }, 0); }
  else if (act === 'saveStarter') { const x = STARTERS[+el.dataset.i]; if (!S.foods.some(f => f.name === x.name)) { S.foods.push({ id: uid(), name: x.name, kcal: x.kcal, p: x.p, c: x.c, f: x.f }); touch('foods'); } }
  else if (act === 'copy') { const text = JSON.stringify({ days: S.days, foods: S.foods, settings: S.settings }, null, 1); const msg = $('#copyMsg'); const done = ok => { if (msg) msg.textContent = ok ? 'Copied. Paste it into a note to keep a backup.' : 'Copying is blocked here.'; };
    try { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); } catch (err) { done(false); } return; }
  else return;
  renderAll();
});
document.addEventListener('submit', e => {
  const form = e.target; if (!form.dataset || !form.dataset.form) return; e.preventDefault();
  if (form.dataset.form === 'food') {
    const f = draft.food, kcal = val(f.kcal), p = val(f.p), qty = val(f.qty) || 1, name = f.name.trim(), err = $('#fErr');
    if (!name || kcal == null || kcal < 0) { if (err) err.textContent = 'Give the food a name and its calories.'; return; }
    const food = { name, kcal, p: p || 0, c: val(f.c) || 0, f: val(f.f) || 0 };
    if (f.save) { let saved = S.foods.find(x => x.name.toLowerCase() === name.toLowerCase()); if (saved) Object.assign(saved, food); else { saved = Object.assign({ id: uid() }, food); S.foods.push(saved); } food.fid = saved.id; touch('foods'); }
    addEntry(food, qty); draft.food = { name: '', kcal: '', p: '', c: '', f: '', qty: '1', save: true };
  } else {
    const r = draft.recipe, name = r.name.trim(), rows = r.rows.filter(x => x.name.trim() || val(x.kcal) != null), err = $('#rErr');
    if (!name || !rows.length || rows.every(x => val(x.kcal) == null)) { if (err) err.textContent = 'Give it a name and at least one ingredient with calories.'; return; }
    const t = recipeTotals({ rows, makes: r.makes }), rnd = v => Math.round(v * 10) / 10;
    const food = { name, kcal: Math.round(t.kcal), p: rnd(t.p), c: rnd(t.c), f: rnd(t.f), makes: val(r.makes) || 1, recipe: rows.map(x => ({ name: x.name.trim(), kcal: val(x.kcal) || 0, p: val(x.p) || 0, c: val(x.c) || 0, f: val(x.f) || 0 })) };
    const cur = r.id && S.foods.find(x => x.id === r.id); if (cur) { Object.assign(cur, food); const us = S.settings && S.settings.usual;   // keep the usual day in step with the edited food
      if (Array.isArray(us) && us.some(x => x.fid === cur.id)) { us.forEach(x => { if (x.fid === cur.id) Object.assign(x, { name: food.name, kcal: food.kcal, p: food.p, c: food.c, f: food.f }); }); touch('settings'); } }
    else S.foods.push(Object.assign({ id: uid() }, food));
    touch('foods'); draft.recipe = blankRecipe();
  }
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  renderAll();
});

// ---- tabs, resize, start
function route() { const h = (location.hash || '').slice(1); ui.tab = ['today', 'trends', 'foods', 'plan'].includes(h) ? h : 'today'; hideTip(); renderAll(); }
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
let seenToday = todayIso();                 // a tab left open overnight: move on to the new day instead of writing into yesterday
function newDay() { const t = todayIso(); if (t === seenToday) return; if (ui.date === seenToday) ui.date = t; seenToday = t; renderAll(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) newDay(); }); window.addEventListener('focus', newDay); window.addEventListener('pageshow', newDay); setInterval(newDay, 60000);
let rz = null; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (ui.tab === 'trends') { drawWeight(); renderBars(); } }, 150); });
loadLocal(); route(); connect();
if (mode === 'starting') {                 // a saved log is on its way: hold input until it has answered (10 s at most), so no tap lands on an out-of-date copy
  const m = $('main'), t0 = Date.now(); m.inert = true; m.style.opacity = 0.6; setSave('Loading…');
  const iv = setInterval(() => { if (mode !== 'starting' || Date.now() - t0 > 10000) { clearInterval(iv); m.inert = false; m.style.opacity = ''; } }, 50);
}
})();
</script>
