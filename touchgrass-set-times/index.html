<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TouchGrass Music Fest · Set Times</title>
  <meta name="description" content="Set times for both stages at TouchGrass Music Fest, Saturday October 3, 2026 at Orlando Amphitheater. Save your sets and spot overlaps.">
  <meta name="theme-color" content="#0e110b">
  <meta property="og:title" content="TouchGrass Music Fest · Set Times">
  <meta property="og:description" content="Both stages, one screen. Save your sets and spot overlaps.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%23c9ff3f'/%3E%3Cpath d='M14 44V22h10M24 22H14M28 44V22h9c4 0 6 2 6 5.5S41 33 37 33h-9' stroke='%230e110b' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&family=Titan+One&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- shared drawings: one cloud, one speaker, reused below -->
  <svg class="symbols" aria-hidden="true" focusable="false">
    <symbol id="cloud" viewBox="0 0 120 60">
      <path d="M20 52H100A14 14 0 0 0 100 24A20 20 0 0 0 64 14A18 18 0 0 0 32 24A16 16 0 0 0 20 52Z" fill="#f4ffd8" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="spk" viewBox="0 0 60 80">
      <rect x="2" y="2" width="56" height="76" rx="4" fill="#000"/>
      <rect x="7" y="7" width="46" height="66" rx="2" fill="none" stroke="#c9ff3f" stroke-width="2"/>
      <circle cx="30" cy="50" r="19" fill="#c9ff3f"/>
      <circle cx="30" cy="50" r="11" fill="#000" stroke="#c9ff3f" stroke-width="4"/>
      <circle cx="30" cy="50" r="3" fill="#c9ff3f"/>
      <circle cx="30" cy="19" r="8" fill="#c9ff3f"/>
      <circle cx="30" cy="19" r="4" fill="#000"/>
    </symbol>
  </svg>

  <header class="masthead">
    <svg class="cloud c1" viewBox="0 0 120 60" aria-hidden="true"><use href="#cloud"/></svg>
    <svg class="cloud c2" viewBox="0 0 120 60" aria-hidden="true"><use href="#cloud"/></svg>
    <svg class="cloud c3" viewBox="0 0 120 60" aria-hidden="true"><use href="#cloud"/></svg>
    <div class="wrap">
      <p class="eyebrow">
        <span class="eyebrow-tag" id="festName">TouchGrass Music Fest</span>
        <span class="eyebrow-tag" id="festVenue">Orlando Amphitheater</span>
      </p>
      <h1 class="title">Set Times</h1>
      <p class="meta">
        <span id="festDate">Sat Oct 3, 2026</span>
        <span class="sep" aria-hidden="true">·</span>
        <span id="festHours">12 PM – 11 PM</span>
        <span class="sep" aria-hidden="true">·</span>
        <span id="festStages">Two stages</span>
      </p>
      <div class="countdown" id="countdown" data-mode="before" aria-live="off"></div>
    </div>
  </header>

  <section class="live" id="live" hidden aria-live="polite"></section>

  <div class="toolbar" id="toolbar">
    <div class="wrap toolbar-row">
      <div class="seg" role="tablist" aria-label="View">
        <button type="button" class="seg-btn is-active" data-view="timeline" role="tab" aria-selected="true">Timeline</button>
        <button type="button" class="seg-btn" data-view="list" role="tab" aria-selected="false">List</button>
      </div>
      <div class="chips" id="stageChips" aria-label="Filter by stage"></div>
      <div class="tools">
        <button type="button" class="chip chip-mine" id="mineBtn" aria-pressed="false" aria-label="My sets"><svg class="tick" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false"><path d="M2 7.5l3.2 3L12 3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">My sets</span> <span class="count" id="mineCount">0</span></button>
        <button type="button" class="icon-btn" id="zoomOut" aria-label="Zoom out timeline"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false"><path d="M1 7h12" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg></button>
        <button type="button" class="icon-btn" id="zoomIn" aria-label="Zoom in timeline"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false"><path d="M1 7h12M7 1v12" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg></button>
        <button type="button" class="icon-btn now-btn" id="nowBtn" hidden>Now</button>
      </div>
    </div>
  </div>

  <div class="minebar" id="minebar" hidden>
    <div class="wrap">
      <span id="mineSummary"></span>
      <span class="spacer"></span>
      <button type="button" class="text-btn" id="copyBtn">Copy list</button>
      <button type="button" class="text-btn" id="clearBtn">Clear all</button>
    </div>
  </div>

  <main>
    <section class="view view-timeline" id="timelineView">
      <div class="wrap">
        <div class="grid" id="grid"></div>
      </div>
    </section>

    <section class="view view-list" id="listView" hidden>
      <div class="wrap">
        <div id="listRoot"></div>
      </div>
    </section>
  </main>

  <div class="grass-edge" aria-hidden="true"></div>
  <footer class="ground">
    <div class="wrap">
      <svg class="speakers" viewBox="0 0 150 120" aria-hidden="true">
        <use href="#spk" x="6" y="44" width="56" height="74" transform="rotate(-4 34 81)"/>
        <use href="#spk" x="58" y="8" width="52" height="68"/>
        <use href="#spk" x="94" y="52" width="52" height="66" transform="rotate(5 120 85)"/>
      </svg>
      <div class="ground-text">
        <p class="ground-note">*<span id="footNote">Set times subject to change.</span></p>
        <p class="ground-hint">Tap a set to save it · Saved sets stay on this device</p>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast" hidden role="status"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
